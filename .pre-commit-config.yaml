repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: local
    hooks:
      - id: block-sealed-params
        name: never commit the sealed true parameters
        entry: sealed/true_params.json must not be committed before unsealing
        language: fail
        files: ^sealed/true_params\.json$
