[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floatlab"
version = "0.1.0"
description = "Forecast-triggered float alerts for mobile money agents: simulator, cluster-randomised experiment, probabilistic forecast and an evaluated AI reviewer."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "duckdb>=1.0",
]

[project.optional-dependencies]
forecast = ["lightgbm>=4.3", "mapie>=0.8", "statsforecast>=1.7"]
reviewer = ["anthropic>=0.40"]
dbt = ["dbt-duckdb>=1.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=floatlab --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
